<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>KKH TV-Wartung – Verwaltung</title>
  <link rel="stylesheet" href="style.css?v=190">
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><rect width='100' height='100' rx='20' fill='%2300695C'/><rect x='20' y='28' width='60' height='38' rx='5' fill='white'/><path d='M35 45l8 8 18-16' stroke='%2300695C' stroke-width='7' fill='none' stroke-linecap='round' stroke-linejoin='round'/></svg>">
</head>
<body>
  <div id="app">
    <!-- Login -->
    <div id="login-view" class="login-wrap" hidden>
      <div class="login-card">
        <div class="login-logo">KKH TV-Wartung</div>
        <div class="login-sub">Verwaltung · Kinderkrankenhaus Köln · EXCERO GmbH</div>
        <input type="text" id="login-user" placeholder="Benutzername" autocomplete="username" autocapitalize="none">
        <input type="password" id="login-pw" placeholder="Passwort" autocomplete="current-password">
        <button class="btn primary" id="login-btn">Anmelden</button>
        <div id="login-fehler" class="fehler" hidden></div>
      </div>
    </div>

    <!-- Hauptansicht -->
    <div id="main-view" hidden>
      <header class="topbar">
        <div class="topbar-title">
          <span class="topbar-logo">KKH TV-Wartung</span>
          <span class="topbar-sub">Kinderkrankenhaus Köln, Amsterdamer Straße</span>
        </div>
        <nav class="topnav">
          <a href="#/dashboard" data-nav="dashboard">Dashboard</a>
          <a href="#/zimmer" data-nav="zimmer">Zimmer</a>
          <a href="#/pruefungen" data-nav="pruefungen">Prüfungen</a>
          <a href="#/stundenzettel" data-nav="stundenzettel">Stundenzettel</a>
          <a href="#/mitarbeiter" data-nav="mitarbeiter">Mitarbeiter</a>
          <a href="#/benutzer" data-nav="benutzer">Benutzer</a>
        </nav>
        <div class="topbar-user">
          <span id="aktueller-benutzer" class="benutzer-chip"></span>
          <button class="btn ghost klein" id="pw-aendern-btn">Passwort ändern</button>
          <button class="btn ghost" id="logout-btn">Abmelden</button>
        </div>
      </header>
      <main id="content"></main>
    </div>
  </div>
  <script src="app.js?v=190"></script>
</body>
</html>
