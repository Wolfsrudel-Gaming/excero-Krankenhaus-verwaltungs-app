# In den bestehenden server { … }-Block der Domain einfügen
# (Pfad /kkh wird an den KKH-Container weitergereicht):

location /kkh {
    proxy_pass http://127.0.0.1:8090;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-Proto $scheme;
    client_max_body_size 300m;   # Foto-/Datei-Uploads der App
    proxy_read_timeout 120s;
}
